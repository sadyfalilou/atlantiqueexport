name: Traiter la queue de courriels

# ⚠️ CE WORKFLOW N'EST QU'UN FILET DE SÉCURITÉ.
#
# L'ordonnanceur principal est cron-job.org, qui appelle la même route toutes
# les 5 minutes. La raison est mesurée, pas théorique : réglé ici sur toutes
# les 5 minutes, ce workflow n'a produit AUCUNE exécution planifiée en une
# heure quarante-cinq. GitHub traite les tâches planifiées « au mieux » et
# peut n'en exécuter aucune pendant des heures — acceptable pour une tâche de
# ménage, pas pour un accusé de paiement.
#
# Il reste ici en secours, à cadence lente, au cas où le service externe
# tomberait. Deux appels simultanés sont sans danger depuis que la file est
# réservée par `claim_emails` : le second saute les courriels déjà pris.
#
# ⚠️ GitHub désactive les workflows planifiés après 60 jours sans activité sur
# le dépôt.

on:
  schedule:
    - cron: "*/30 * * * *"
  # Permet de déclencher un traitement à la main depuis l'onglet Actions,
  # utile pour vider la queue sans attendre le prochain créneau.
  workflow_dispatch:

# Aucun droit sur le dépôt : le workflow ne fait qu'un appel sortant.
permissions: {}

concurrency:
  # Deux traitements simultanés enverraient deux fois le même courriel.
  group: traiter-courriels
  cancel-in-progress: false

jobs:
  traiter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler /api/cron/send-emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://atlantiqueexport.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Le secret CRON_SECRET n'est pas défini dans ce dépôt."
            exit 1
          fi

          # --fail-with-body : sortir en erreur sur un statut >= 400, tout en
          # affichant le corps de la réponse, qui porte le détail de l'échec.
          curl --fail-with-body -sS \
            --max-time 120 \
            --retry 2 --retry-delay 10 --retry-connrefused \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/send-emails"
